<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letter</title>
    <meta name="description" content="Awesome "Portfolio" with Discord Status">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="animated-bg">
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
    </div>

    <nav class="navbar glassmorphism">
        <div class="logo">letter</div>
    </nav>

    <main>
        <section id="home" class="hero-section">
            <div class="hero-content" data-tilt>
                <h1>Hello, I'm a <span class="gradient-text">letter</span></h1>
                <p>cheeseburger.</p>
            </div>
            <div class="discord-card glassmorphism" data-tilt>
                <div class="discord-banner" id="discord-banner"></div>
                <div class="discord-profile">
                    <div class="avatar-wrapper">
                        <img id="discord-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Discord Avatar" class="discord-avatar">
                        <div id="discord-status-indicator" class="status-indicator offline"></div>
                    </div>
                    <div class="discord-header-info">
                        <h3 id="discord-global-name">Loading...</h3>
                        <p id="discord-username">@loading</p>
                        <div id="discord-badges" class="discord-badges"></div>
                    </div>
                </div>
                <div class="discord-body">
                    <div class="discord-bio" id="discord-bio"></div>
                    <div class="discord-activity-box">
                        <h4 class="activity-label" id="activity-label">ABOUT ME</h4>
                        <p id="discord-activity" class="activity-text">Fetching status...</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
